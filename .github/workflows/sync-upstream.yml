name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    name: Check upstream and create sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and check upstream
        id: check
        run: |
          git remote add upstream https://github.com/luqman-v1/9router-go.git
          git fetch upstream main
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "behind_count=$BEHIND_COUNT" >> "$GITHUB_OUTPUT"
          echo "Upstream has $BEHIND_COUNT new commit(s)"

      - name: Create or update upstream sync PR
        if: steps.check.outputs.behind_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND_COUNT: ${{ steps.check.outputs.behind_count }}
        run: |
          UPSTREAM_COMMITS=$(git log --oneline HEAD..upstream/main)
          TITLE="chore: sync with upstream luqman-v1/9router-go ($(date +'%Y-%m-%d'))"
          BODY=$(printf "### Upstream Sync\n\nNew commits detected on \`luqman-v1/9router-go:main\` (%s commit(s)):\n\n\`\`\`\n%s\n\`\`\`\n\nPlease review changes before merging into \`main\`. Merging to \`main\` will automatically trigger Docker build and push to Docker Hub." "$BEHIND_COUNT" "$UPSTREAM_COMMITS")

          EXISTING_PR=$(gh api "repos/${{ github.repository }}/pulls?state=open&head=luqman-v1:main&base=main" --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/pulls/$EXISTING_PR" \
              -f title="$TITLE" \
              -f body="$BODY" > /dev/null
            echo "Sync PR #$EXISTING_PR is already open and updated with latest commits."
          else
            PR_URL=$(gh api "repos/${{ github.repository }}/pulls" \
              -f title="$TITLE" \
              -f head="luqman-v1:main" \
              -f base="main" \
              -f body="$BODY" \
              --jq '.html_url')
            echo "Created sync PR: $PR_URL"
          fi
