name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    name: Sync with upstream root repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and check upstream
        id: check
        run: |
          git remote add upstream https://github.com/luqman-v1/9router-go.git
          git fetch upstream main
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "behind_count=$BEHIND_COUNT" >> "$GITHUB_OUTPUT"
          echo "Upstream has $BEHIND_COUNT new commit(s)"

      - name: Merge upstream into fork
        id: merge
        if: steps.check.outputs.behind_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git merge upstream/main --no-edit -m "chore: sync with upstream luqman-v1/9router-go"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            git push origin main
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git merge --abort
            echo "::error::Merge conflict detected with upstream/main"
            echo "Conflicting files:"
            echo "$CONFLICTS"
            
            EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "Upstream sync conflict" --json number -q '.[0].number')
            if [ -z "$EXISTING" ]; then
              BODY=$(printf "Automatic sync with upstream (luqman-v1/9router-go:main) encountered merge conflicts.\n\nConflicted files:\n%s\n\nResolution steps:\n  git checkout main\n  git fetch upstream main\n  git merge upstream/main\n  # Resolve conflicts\n  git commit -m 'chore: merge upstream/main and resolve conflicts'\n  git push origin main" "$CONFLICTS")
              gh issue create --repo "${{ github.repository }}" \
                --title "⚠️ Upstream sync conflict detected" \
                --body "$BODY"
            fi
            exit 1
          fi

      - name: Trigger Docker build on sync
        if: steps.check.outputs.behind_count != '0' && steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker.yml --ref main || true
