name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Check upstream and create sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and check upstream
        id: check
        run: |
          git remote add upstream https://github.com/luqman-v1/9router-go.git
          git fetch upstream main
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "behind_count=$BEHIND_COUNT" >> "$GITHUB_OUTPUT"
          echo "Upstream has $BEHIND_COUNT new commit(s)"

      - name: Push upstream-sync branch and open PR
        if: steps.check.outputs.behind_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -B upstream-sync upstream/main
          git push -f origin upstream-sync

          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head upstream-sync --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Sync PR #$EXISTING_PR is already open and updated with latest commits."
          else
            UPSTREAM_COMMITS=$(git log --oneline -n "${{ steps.check.outputs.behind_count }}" upstream/main)
            BODY=$(printf "### Upstream Sync\n\nNew commits detected on \`luqman-v1/9router-go:main\` (%s commit(s)):\n\n\`\`\`\n%s\n\`\`\`\n\nPlease review changes before merging into \`main\`. Merging to \`main\` will automatically trigger Docker build and push to Docker Hub." "${{ steps.check.outputs.behind_count }}" "$UPSTREAM_COMMITS")

            gh pr create --repo "${{ github.repository }}" \
              --base main \
              --head upstream-sync \
              --title "chore: sync with upstream luqman-v1/9router-go ($(date +'%Y-%m-%d'))" \
              --body "$BODY"
          fi
